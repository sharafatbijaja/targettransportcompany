<svg xmlns="http://www.w3.org/2000/svg" viewBox="80 35 730 475" width="900" height="586" role="img">
  <title>Target Transport routes across Saudi Arabia</title>
  <defs>
    <style>
      :root {
        --brand-blue: #4a71c1;
        --brand-green: #55a13e;
      }

      .saudi-map {
        fill: rgba(74, 113, 193, 0.11);
        stroke: var(--brand-blue);
        stroke-width: 2.5;
        stroke-linejoin: round;
      }

      .route-line {
        fill: none;
        stroke: var(--brand-green);
        stroke-width: 2.3;
        stroke-linecap: round;
        stroke-dasharray: 7 5;
        animation: flowLine 2.4s linear infinite;
      }

      .glow-green {
        filter: drop-shadow(0px 0px 4px rgba(85, 161, 62, 0.55));
      }

      .glow-blue {
        filter: drop-shadow(0px 0px 4px rgba(74, 113, 193, 0.55));
      }

      .pulse-ring {
        fill: none;
        stroke: var(--brand-green);
        stroke-width: 2.5;
        transform-origin: 485px 270px;
        animation: pulse 2.2s ease-out infinite;
      }

      .badge-text {
        fill: #ffffff;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.2px;
      }

      .badge-box {
        stroke: #ffffff;
        stroke-width: 1.3;
        filter: drop-shadow(0px 2px 3px rgba(0, 0, 0, 0.18));
      }

      @keyframes flowLine {
        to { stroke-dashoffset: -24; }
      }

      @keyframes pulse {
        0% { transform: scale(0.85); opacity: 1; }
        100% { transform: scale(3.2); opacity: 0; }
      }

      @media (prefers-reduced-motion: reduce) {
        .route-line { animation: none; }
        .pulse-ring { animation: none; opacity: 0; }
        .vehicle { display: none; }
      }
    </style>

    <g id="icon-car">
      <rect x="-11" y="-5.5" width="22" height="11" rx="4" fill="var(--brand-blue)" stroke="#ffffff" stroke-width="1.4"/>
      <rect x="-5.5" y="-3" width="11" height="6" rx="2" fill="#ffffff" opacity="0.95"/>
    </g>

    <g id="icon-coaster">
      <rect x="-15" y="-6.5" width="30" height="13" rx="4" fill="var(--brand-green)" stroke="#ffffff" stroke-width="1.4"/>
      <line x1="-7" y1="-3.5" x2="9" y2="-3.5" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round"/>
      <line x1="-7" y1="3.5" x2="9" y2="3.5" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round"/>
    </g>

    <g id="icon-bus">
      <rect x="-18" y="-7.5" width="36" height="15" rx="3.5" fill="var(--brand-blue)" stroke="var(--brand-green)" stroke-width="1.7"/>
      <rect x="-12" y="-4" width="24" height="8" rx="1.5" fill="#ffffff" opacity="0.95"/>
    </g>

    <path id="path-dammam" d="M 485 270 Q 560 245 635 235" />
    <path id="path-hafar" d="M 485 270 Q 505 200 515 155" />
    <path id="path-tabuk" d="M 485 270 Q 320 150 175 115" />
    <path id="path-madinah" d="M 485 270 Q 360 220 250 230" />
    <path id="path-jeddah" d="M 485 270 Q 340 285 215 315" />
    <path id="path-makkah" d="M 485 270 Q 365 305 260 330" />
    <path id="path-taif" d="M 485 270 Q 395 315 305 345" />
    <path id="path-abha" d="M 485 270 Q 405 360 335 435" />
  </defs>

  <style>
    svg {
      background: transparent;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
    }
  </style>

  <path class="saudi-map" d="M 130 95 L 215 80 L 295 65 L 410 115 L 545 165 L 650 220 L 685 265 L 745 310 L 675 395 L 485 425 L 365 465 L 310 455 L 265 375 L 210 295 L 185 200 L 125 135 Z" />

  <use href="#path-dammam" class="route-line" />
  <use href="#path-hafar" class="route-line" />
  <use href="#path-tabuk" class="route-line" />
  <use href="#path-madinah" class="route-line" />
  <use href="#path-jeddah" class="route-line" />
  <use href="#path-makkah" class="route-line" />
  <use href="#path-taif" class="route-line" />
  <use href="#path-abha" class="route-line" />

  <g class="glow-blue vehicle">
    <use href="#icon-car">
      <animateMotion dur="3.1s" repeatCount="indefinite" rotate="auto" begin="0.2s"><mpath href="#path-dammam"/></animateMotion>
    </use>
  </g>
  <g class="glow-green vehicle">
    <use href="#icon-coaster">
      <animateMotion dur="3.4s" repeatCount="indefinite" rotate="auto" begin="1.1s"><mpath href="#path-hafar"/></animateMotion>
    </use>
  </g>
  <g class="glow-blue vehicle">
    <use href="#icon-bus">
      <animateMotion dur="5.5s" repeatCount="indefinite" rotate="auto" begin="0.7s"><mpath href="#path-tabuk"/></animateMotion>
    </use>
  </g>
  <g class="glow-green vehicle">
    <use href="#icon-coaster">
      <animateMotion dur="4.1s" repeatCount="indefinite" rotate="auto" begin="0.4s"><mpath href="#path-madinah"/></animateMotion>
    </use>
  </g>
  <g class="glow-blue vehicle">
    <use href="#icon-bus">
      <animateMotion dur="4.6s" repeatCount="indefinite" rotate="auto" begin="0s"><mpath href="#path-jeddah"/></animateMotion>
    </use>
  </g>
  <g class="glow-green vehicle">
    <use href="#icon-coaster">
      <animateMotion dur="4.2s" repeatCount="indefinite" rotate="auto" begin="1.6s"><mpath href="#path-makkah"/></animateMotion>
    </use>
  </g>
  <g class="glow-blue vehicle">
    <use href="#icon-car">
      <animateMotion dur="3.7s" repeatCount="indefinite" rotate="auto" begin="0.9s"><mpath href="#path-taif"/></animateMotion>
    </use>
  </g>
  <g class="glow-blue vehicle">
    <use href="#icon-bus">
      <animateMotion dur="4.8s" repeatCount="indefinite" rotate="auto" begin="1.3s"><mpath href="#path-abha"/></animateMotion>
    </use>
  </g>

  <circle cx="175" cy="115" r="5.5" fill="var(--brand-green)" stroke="#ffffff" stroke-width="1.8" />
  <g transform="translate(122, 82)">
    <rect x="0" y="0" width="94" height="22" rx="5" fill="var(--brand-green)" class="badge-box" />
    <text x="47" y="15" text-anchor="middle" class="badge-text">Tabuk &#160; تبوك</text>
  </g>

  <circle cx="515" cy="155" r="5.5" fill="var(--brand-blue)" stroke="#ffffff" stroke-width="1.8" />
  <g transform="translate(442, 122)">
    <rect x="0" y="0" width="154" height="22" rx="5" fill="var(--brand-blue)" class="badge-box" />
    <text x="77" y="15" text-anchor="middle" class="badge-text">Hafar-Albatin &#160; حفر الباطن</text>
  </g>

  <circle cx="635" cy="235" r="6" fill="var(--brand-blue)" stroke="#ffffff" stroke-width="1.8" />
  <g transform="translate(646, 224)">
    <rect x="0" y="0" width="114" height="22" rx="5" fill="var(--brand-blue)" class="badge-box" />
    <text x="57" y="15" text-anchor="middle" class="badge-text">Dammam &#160; الدمام</text>
  </g>

  <circle cx="250" cy="230" r="5.5" fill="var(--brand-green)" stroke="#ffffff" stroke-width="1.8" />
  <g transform="translate(130, 219)">
    <rect x="0" y="0" width="110" height="22" rx="5" fill="var(--brand-green)" class="badge-box" />
    <text x="55" y="15" text-anchor="middle" class="badge-text">Madinah &#160; المدينة</text>
  </g>

  <circle cx="215" cy="315" r="5.5" fill="var(--brand-green)" stroke="#ffffff" stroke-width="1.8" />
  <g transform="translate(105, 304)">
    <rect x="0" y="0" width="98" height="22" rx="5" fill="var(--brand-green)" class="badge-box" />
    <text x="49" y="15" text-anchor="middle" class="badge-text">Jeddah &#160; جدة</text>
  </g>

  <circle cx="260" cy="330" r="5.5" fill="var(--brand-blue)" stroke="#ffffff" stroke-width="1.8" />
  <g transform="translate(152, 338)">
    <rect x="0" y="0" width="98" height="22" rx="5" fill="var(--brand-blue)" class="badge-box" />
    <text x="49" y="15" text-anchor="middle" class="badge-text">Makkah &#160; مكة</text>
  </g>

  <circle cx="305" cy="345" r="5.5" fill="var(--brand-blue)" stroke="#ffffff" stroke-width="1.8" />
  <g transform="translate(265, 364)">
    <rect x="0" y="0" width="94" height="22" rx="5" fill="var(--brand-blue)" class="badge-box" />
    <text x="47" y="15" text-anchor="middle" class="badge-text">Taif &#160; الطائف</text>
  </g>

  <circle cx="335" cy="435" r="5.5" fill="var(--brand-green)" stroke="#ffffff" stroke-width="1.8" />
  <g transform="translate(288, 448)">
    <rect x="0" y="0" width="90" height="22" rx="5" fill="var(--brand-green)" class="badge-box" />
    <text x="45" y="15" text-anchor="middle" class="badge-text">Abha &#160; أبها</text>
  </g>

  <circle cx="485" cy="270" r="10" class="pulse-ring" />
  <circle cx="485" cy="270" r="9" fill="var(--brand-blue)" stroke="#ffffff" stroke-width="2.5" />
  <g transform="translate(498, 268)">
    <rect x="0" y="0" width="106" height="24" rx="5" fill="var(--brand-green)" class="badge-box" />
    <text x="53" y="16" text-anchor="middle" class="badge-text">Riyadh &#160; الرياض</text>
  </g>
</svg>
