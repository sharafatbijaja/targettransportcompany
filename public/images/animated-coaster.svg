<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <!-- Riyadh Sunset Sky -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E3C72"/>
      <stop offset="55%" stop-color="#F2994A"/>
      <stop offset="100%" stop-color="#F2C94C"/>
    </linearGradient>

    <!-- Desert Sand -->
    <linearGradient id="sandGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E6B87D"/>
      <stop offset="100%" stop-color="#C88D4B"/>
    </linearGradient>

    <!-- 2026 Coaster Pearl White Body -->
    <linearGradient id="coasterBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="72%" stop-color="#F8F9FA"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>

    <!-- Flush Blackout Glass Window Tint -->
    <linearGradient id="glassTint" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1C2833"/>
      <stop offset="50%" stop-color="#2C3E50"/>
      <stop offset="100%" stop-color="#17202A"/>
    </linearGradient>

    <!-- 2026 Coaster 17.5-inch Heavy-Duty 6-Lug Steel Wheel -->
    <g id="coasterWheel2026">
      <!-- Tire 215/70R17.5 -->
      <circle cx="0" cy="0" r="21" fill="#181A1B"/>
      <circle cx="0" cy="0" r="18.5" fill="none" stroke="#2D3134" stroke-width="1.5"/>
      <!-- 17.5" Silver Steel Rim -->
      <circle cx="0" cy="0" r="12.5" fill="#CBD5E1" stroke="#64748B" stroke-width="1"/>
      <!-- Ventilation Holes -->
      <circle cx="0" cy="-8" r="1.6" fill="#1E293B"/>
      <circle cx="7" cy="-4" r="1.6" fill="#1E293B"/>
      <circle cx="7" cy="4" r="1.6" fill="#1E293B"/>
      <circle cx="0" cy="8" r="1.6" fill="#1E293B"/>
      <circle cx="-7" cy="4" r="1.6" fill="#1E293B"/>
      <circle cx="-7" cy="-4" r="1.6" fill="#1E293B"/>
      <!-- Center Hub & 6 Lug Nuts -->
      <circle cx="0" cy="0" r="5" fill="#475569"/>
      <circle cx="0" cy="0" r="2.5" fill="#94A3B8"/>
      <animateTransform class="motion" attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="0.55s" repeatCount="indefinite"/>
    </g>

    <!-- Palm Tree -->
    <g id="palmTree">
      <path d="M-4,0 Q-2,-45 2,-90 L8,-90 Q4,-45 6,0 Z" fill="#6D4C41"/>
      <path d="M5,-88 Q-25,-105 -45,-80 Q-20,-90 5,-85 Z" fill="#2E7D32"/>
      <path d="M5,-88 Q-15,-120 -35,-105 Q-10,-105 5,-85 Z" fill="#388E3C"/>
      <path d="M5,-88 Q35,-105 55,-80 Q30,-90 5,-85 Z" fill="#2E7D32"/>
      <path d="M5,-88 Q25,-120 45,-105 Q20,-105 5,-85 Z" fill="#388E3C"/>
      <path d="M5,-88 Q5,-125 0,-115 Q2,-100 5,-85 Z" fill="#43A047"/>
    </g>
  </defs>
  <style>
    @media (prefers-reduced-motion: reduce) {
      .motion { display: none; }
    }
  </style>

  <!-- 1. Sky & Sun -->
  <rect width="800" height="310" fill="url(#skyGrad)"/>
  <circle cx="660" cy="105" r="42" fill="#FFF3B0" opacity="0.85"/>

  <!-- 2. Riyadh Skyline (Parallax Scrolling) -->
  <g>
    <animateTransform class="motion" attributeName="transform" type="translate" from="0 0" to="-800 0" dur="24s" repeatCount="indefinite"/>
    <g id="riyadhSkyline">
      <rect x="60" y="190" width="40" height="120" fill="#5D6D7E" opacity="0.6"/>
      <rect x="110" y="160" width="50" height="150" fill="#4A5568" opacity="0.7"/>
      <!-- Al Faisaliah Tower -->
      <polygon points="180,310 205,120 230,310" fill="#3B4856" opacity="0.8"/>
      <circle cx="205" cy="155" r="8" fill="#F2C94C"/>
      <!-- Kingdom Centre (Mamlaka Tower) -->
      <g transform="translate(380, 65)">
        <path d="M0,245 L18,0 L62,0 L80,245 Z" fill="#4A607A"/>
        <path d="M26,18 Q40,85 54,18 Z" fill="url(#skyGrad)"/>
        <rect x="20" y="12" width="40" height="5" fill="#D6EAF8"/>
      </g>
      <rect x="500" y="175" width="45" height="135" fill="#5D6D7E" opacity="0.65"/>
      <rect x="560" y="140" width="55" height="170" fill="#34495E" opacity="0.75"/>
      <rect x="640" y="195" width="60" height="115" fill="#5D6D7E" opacity="0.6"/>
    </g>
    <use href="#riyadhSkyline" x="800"/>
  </g>

  <!-- 3. Desert Sand -->
  <rect x="0" y="300" width="800" height="45" fill="url(#sandGrad)"/>

  <!-- 4. Moving Palm Trees -->
  <g>
    <animateTransform class="motion" attributeName="transform" type="translate" from="0 0" to="-800 0" dur="6s" repeatCount="indefinite"/>
    <use href="#palmTree" x="120" y="325"/>
    <use href="#palmTree" x="390" y="325"/>
    <use href="#palmTree" x="670" y="325"/>
    <use href="#palmTree" x="920" y="325"/>
    <use href="#palmTree" x="1190" y="325"/>
    <use href="#palmTree" x="1470" y="325"/>
  </g>

  <!-- 5. Riyadh Highway -->
  <rect x="0" y="325" width="800" height="125" fill="#26292C"/>
  <line x1="0" y1="332" x2="800" y2="332" stroke="#F1C40F" stroke-width="3"/>
  <line x1="0" y1="435" x2="800" y2="435" stroke="#ECF0F1" stroke-width="4"/>
  <line x1="0" y1="382" x2="1600" y2="382" stroke="#FFFFFF" stroke-width="5" stroke-dasharray="45 35">
    <animateTransform class="motion" attributeName="transform" type="translate" from="0 0" to="-160 0" dur="0.48s" repeatCount="indefinite"/>
  </line>

  <!-- 6. Exact 2026 Toyota Coaster (4th Gen B60 High-Roof Long Body) -->
  <g transform="translate(190, 208)">
    <!-- Suspension Bounce -->
    <animateTransform class="motion" attributeName="transform" type="translate" values="190,208; 190,206.5; 190,208" dur="0.35s" repeatCount="indefinite"/>

    <!-- Ground Shadow -->
    <ellipse cx="205" cy="153" rx="198" ry="9" fill="#0F1112" opacity="0.6"/>

    <!-- Roof Integrated Air Conditioning Pod (2026 Low-Profile Design) -->
    <path d="M135,12 Q145,5 160,5 L265,5 Q278,5 285,12 Z" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1"/>

    <!-- 2026 Boxy High-Roof Body Silhouette -->
    <path d="M12,135 
             L12,24 
             Q12,12 26,12 
             L345,12 
             Q368,12 376,34 
             L394,76 
             Q400,90 400,108 
             L398,135 Z" 
          fill="url(#coasterBody)" stroke="#94A3B8" stroke-width="1.5"/>

    <!-- Rear Roof Spoiler & High-Mount LED Stop Lamp -->
    <path d="M8,16 L18,12 L18,22 L8,20 Z" fill="#CBD5E1"/>
    <rect x="8" y="17" width="3" height="3" fill="#EF4444"/>

    <!-- Signature 2026 Flush Blackout Panoramic Window Band -->
    <path d="M22,23 L298,23 L298,68 L22,68 Z" fill="#111827" rx="3"/>
    <!-- 4 Large Rectangular Flush Windows with Tinted Glass -->
    <rect x="25" y="25" width="64" height="41" rx="2" fill="url(#glassTint)"/>
    <rect x="93" y="25" width="64" height="41" rx="2" fill="url(#glassTint)"/>
    <rect x="161" y="25" width="64" height="41" rx="2" fill="url(#glassTint)"/>
    <rect x="229" y="25" width="66" height="41" rx="2" fill="url(#glassTint)"/>
    <!-- Subtle Glass Reflection Highlights -->
    <line x1="32" y1="28" x2="55" y2="63" stroke="#FFFFFF" stroke-width="1.5" opacity="0.12"/>
    <line x1="100" y1="28" x2="123" y2="63" stroke="#FFFFFF" stroke-width="1.5" opacity="0.12"/>
    <line x1="168" y1="28" x2="191" y2="63" stroke="#FFFFFF" stroke-width="1.5" opacity="0.12"/>
    <line x1="236" y1="28" x2="259" y2="63" stroke="#FFFFFF" stroke-width="1.5" opacity="0.12"/>

    <!-- Auto-Folding Passenger Entry Door (Positioned behind front wheel) -->
    <rect x="303" y="23" width="34" height="110" rx="2" fill="#F1F5F9" stroke="#64748B" stroke-width="1.2"/>
    <!-- Center Folding Seam -->
    <line x1="320" y1="23" x2="320" y2="133" stroke="#64748B" stroke-width="1.2"/>
    <!-- Dual Tall Door Windows -->
    <rect x="306" y="26" width="11.5" height="46" rx="1.5" fill="url(#glassTint)"/>
    <rect x="322.5" y="26" width="11.5" height="46" rx="1.5" fill="url(#glassTint)"/>
    <!-- Lower Door Step Glass -->
    <rect x="306" y="82" width="11.5" height="28" rx="1.5" fill="url(#glassTint)"/>
    <rect x="322.5" y="82" width="11.5" height="28" rx="1.5" fill="url(#glassTint)"/>

    <!-- Sloped Front Windshield & Passenger Quarter Window (2026 Cab-Forward Design) -->
    <path d="M342,23 L366,23 Q374,38 389,70 L342,70 Z" fill="url(#glassTint)"/>
    <!-- A-Pillar Divider -->
    <line x1="364" y1="23" x2="375" y2="70" stroke="#1E293B" stroke-width="3.5"/>
    <!-- Windshield Wipers -->
    <line x1="378" y1="68" x2="365" y2="38" stroke="#0F172A" stroke-width="2"/>

    <!-- 2026 Side Body Crease Line & Chrome "COASTER" Emblem -->
    <line x1="15" y1="74" x2="392" y2="74" stroke="#CBD5E1" stroke-width="1.5"/>
    <text x="242" y="83" font-family="Arial, sans-serif" font-size="6.5" font-weight="bold" fill="#475569" letter-spacing="1.2">COASTER</text>

    <!-- Front Grille & Swept-Back 2026 Headlamp Unit -->
    <path d="M385,92 L399,92 L399,106 L381,106 Z" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1"/>
    <ellipse cx="392" cy="99" rx="5" ry="4" fill="#FEF08A"/>
    <!-- Amber Turn Signal -->
    <rect x="381" y="94" width="5" height="10" rx="1" fill="#F59E0B"/>
    <!-- Headlight Beam -->
    <polygon points="399,94 475,85 475,118 399,105" fill="#FEF9C3" opacity="0.24"/>

    <!-- Color-Coded Front & Rear Bumpers (2026 Saudi/GCC Spec) -->
    <path d="M378,116 L401,116 Q403,128 399,137 L375,137 Z" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.2"/>
    <rect x="384" y="122" width="12" height="5" rx="1" fill="#1E293B"/> <!-- Bumper Air Intake -->
    <path d="M9,116 L32,116 L32,137 L11,137 Q8,128 9,116 Z" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.2"/>

    <!-- Vertical Rear Taillight Cluster -->
    <rect x="11" y="88" width="5" height="24" rx="1.5" fill="#DC2626"/>
    <rect x="11" y="96" width="5" height="6" fill="#F59E0B"/>

    <!-- Side Reflectors & Mudguards (Front & Rear) -->
    <rect x="42" y="124" width="8" height="3.5" rx="1" fill="#EF4444"/>
    <rect x="260" y="124" width="8" height="3.5" rx="1" fill="#F59E0B"/>
    <!-- Mudguards -->
    <path d="M62,135 L68,135 L68,144 L60,144 Z" fill="#1E293B"/>
    <path d="M335,135 L341,135 L341,144 L333,144 Z" fill="#1E293B"/>

    <!-- Wheel Arches (Long 3,935mm Wheelbase Proportions) -->
    <path d="M66,136 A25,25 0 0,1 116,136 Z" fill="#111827"/>
    <path d="M338,136 A25,25 0 0,1 388,136 Z" fill="#111827"/>

    <!-- Heavy-Duty 2026 Extended Side Mirror Arm (With Integrated Blinker) -->
    <path d="M372,38 L398,35 L402,42 L402,65 L391,65 L391,42 L372,43 Z" fill="#1E293B"/>
    <rect x="399" y="48" width="2.5" height="8" fill="#F59E0B"/>

    <!-- Spinning 17.5" Steel Wheels -->
    <use href="#coasterWheel2026" x="91" y="136"/>
    <use href="#coasterWheel2026" x="363" y="136"/>
  </g>
</svg>
